steps:
  - name: 'node:20'
    dir: 'client'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm ci
        VITE_API_URL=https://api.facilrepuestos.cl npm run build
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project facilrepuestos-prod --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
