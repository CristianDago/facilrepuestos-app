steps:
  # ── 1. Frontend: instalar dependencias y compilar ─────
  - name: 'node:20'
    dir: 'client'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm ci
        VITE_API_URL=https://api.drmotors.cl VITE_GOOGLE_CALENDAR_URL="https://calendar.google.com/calendar/embed?src=taller%40drmotors.cl&ctz=America%2FSantiago" npm run build

  # ── 2. Frontend: desplegar a Firebase Hosting ─────────
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project drmotors-prod --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY